<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGI-TRACK - Driver Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .driver-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .driver-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .driver-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .driver-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #2a2a2a;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border: 2px solid var(--border-color);
        }
        .driver-info h3 {
            margin-bottom: 0.2rem;
            color: var(--text-main);
        }
        .driver-info p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .driver-stats {
            background: #1f1f1f;
            border-radius: var(--radius-md);
            padding: 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        .driver-stats div {
            display: flex;
            flex-direction: column;
        }
        .driver-stats span {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .driver-stats strong {
            color: var(--text-main);
        }
        .vehicle-status {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            width: fit-content;
        }
        .status-available { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid var(--success); }
        .status-assigned { background: rgba(37, 99, 235, 0.1); color: #3b82f6; border: 1px solid #3b82f6; }
        .status-ontrip { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid var(--warning); }
        .status-leave { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        
        .driver-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
        }
        .btn-outline {
            flex: 1;
            padding: 0.5rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .btn-delete {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.1);
        }
    </style>
</head>
<body>
    <div class="app-container fade-in">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>LOGI-TRACK</h2>
            </div>
            <ul class="nav-links">
                <li><a href="operations.html"><i class="fa-solid fa-bolt"></i> Operations</a></li>
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="vehicles.html"><i class="fa-solid fa-truck"></i> Fleet</a></li>
                <li><a href="drivers.html" class="active"><i class="fa-solid fa-users"></i> Drivers</a></li>
                <li><a href="orders.html"><i class="fa-solid fa-box-open"></i> Orders</a></li>
                <li><a href="tracking.html"><i class="fa-solid fa-map-location-dot"></i> Live Tracking</a></li>
                <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" onclick="logout()" class="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header slide-down">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="driver-search" placeholder="Search drivers by name...">
                </div>
                <div class="user-profile">
                    <div class="notification-bell">
                        <i class="fa-solid fa-bell"></i>
                    </div>
                    <div class="avatar"><i class="fa-solid fa-building"></i></div>
                </div>
            </header>

            <div class="page-content slide-up">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h1 class="page-title" style="margin:0;">Driver Management</h1>
                    <button class="btn-primary" style="width: auto; padding: 0.6rem 1.2rem;" onclick="openDriverModal()">
                        <i class="fa-solid fa-plus"></i> Add Driver
                    </button>
                </div>
                
                <div class="driver-grid" id="driver-grid">
                    <!-- Drivers populated here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Add Driver Modal -->
    <div class="modal-overlay hidden" id="driver-modal">
        <div class="modal-content slide-up">
            <div class="modal-header">
                <h3 style="color:var(--text-main);">Onboard New Driver</h3>
                <button class="modal-close" onclick="closeDriverModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="driver-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="drv-name" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="drv-phone" required>
                </div>
                <div class="form-group">
                    <label>Driving License Number</label>
                    <input type="text" id="drv-license" required>
                </div>
                <div class="form-group">
                    <label>Years of Experience</label>
                    <input type="number" id="drv-exp" min="0" required>
                </div>
                <button type="submit" class="btn-primary">Onboard Driver</button>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/drivers.js"></script>
    <script>
        function logout() {
            localStorage.removeItem('company_id');
            window.location.href = 'index.html';
        }
        function openDriverModal() {
            document.getElementById('driver-modal').classList.remove('hidden');
        }
        function closeDriverModal() {
            document.getElementById('driver-modal').classList.add('hidden');
            document.getElementById('driver-form').reset();
        }
        
        // Close modal when clicking outside
        document.getElementById('driver-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeDriverModal();
            }
        });
    </script>
</body>
</html>
