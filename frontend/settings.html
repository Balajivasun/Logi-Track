<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGI-TRACK - Company Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .settings-container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            max-width: 800px;
            margin: 0 auto;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
        }
        .form-group input {
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-group input:focus {
            border-color: var(--primary-color);
        }
        .btn-save {
            background: var(--primary-color);
            color: white;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 2rem;
        }
        .btn-save:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="app-container fade-in">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>LOGI-TRACK</h2>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="vehicles.html"><i class="fa-solid fa-truck"></i> Fleet</a></li>
                <li><a href="drivers.html"><i class="fa-solid fa-users"></i> Drivers</a></li>
                <li><a href="orders.html"><i class="fa-solid fa-box-open"></i> Orders</a></li>
                <li><a href="tracking.html"><i class="fa-solid fa-map-location-dot"></i> Live Tracking</a></li>
                <li><a href="settings.html" class="active"><i class="fa-solid fa-gear"></i> Settings</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" onclick="logout()" class="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header slide-down">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search...">
                </div>
                <div class="user-profile">
                    <div class="notification-bell"><i class="fa-solid fa-bell"></i></div>
                    <div class="avatar" id="company-avatar">C</div>
                </div>
            </header>

            <div class="page-content slide-up">
                <h1 class="page-title">Company Settings</h1>
                
                <div class="settings-container glass-panel">
                    <h3 style="color: var(--text-main); margin-bottom: 0.5rem;">Company Profile</h3>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Update your logistics company details and contact information.</p>
                    
                    <form id="settings-form">
                        <div class="form-grid">
                            <div class="form-group full-width">
                                <label>Company Name</label>
                                <input type="text" id="set-name" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address (Read Only)</label>
                                <input type="email" id="set-email" readonly style="background: #f8fafc; color: #94a3b8;">
                            </div>
                            <div class="form-group">
                                <label>Contact Number</label>
                                <input type="text" id="set-phone">
                            </div>
                            <div class="form-group">
                                <label>GST Number (Optional)</label>
                                <input type="text" id="set-gst" placeholder="e.g. 22AAAAA0000A1Z5">
                            </div>
                            <div class="form-group full-width">
                                <label>Registered Address</label>
                                <input type="text" id="set-address" placeholder="123 Logistics Park, City, Country">
                            </div>
                        </div>
                        <button type="submit" class="btn-save">Save Changes</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const profile = await apiCall('/company/profile');
                document.getElementById('set-name').value = profile.name;
                document.getElementById('set-email').value = profile.email;
                document.getElementById('set-phone').value = profile.contact_number || '';
                document.getElementById('set-gst').value = profile.gst_number || '';
                document.getElementById('set-address').value = profile.address || '';
            } catch (error) {
                showToast('Failed to load profile', 'error');
            }

            document.getElementById('settings-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const payload = {
                    name: document.getElementById('set-name').value,
                    contact_number: document.getElementById('set-phone').value,
                    gst_number: document.getElementById('set-gst').value,
                    address: document.getElementById('set-address').value
                };
                try {
                    await apiCall('/company/profile', 'PUT', payload);
                    showToast('Settings saved successfully!', 'success');
                    document.getElementById('company-name-display').textContent = payload.name;
                } catch(error) {
                    showToast('Failed to save settings', 'error');
                }
            });
        });
    </script>
</body>
</html>
