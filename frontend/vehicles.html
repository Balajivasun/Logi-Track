<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGI-TRACK - Fleet Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .vehicle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .vehicle-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .vehicle-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
        }
        .vehicle-info {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .vehicle-info h3 {
            margin-bottom: 0.2rem;
            font-size: 1.2rem;
            color: var(--text-main);
        }
        .vehicle-type {
            color: var(--primary-color);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }
        .vehicle-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .vehicle-stats div {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .vehicle-status {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            width: fit-content;
        }
        .status-available { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid var(--success); }
        .status-assigned { background: rgba(37, 99, 235, 0.1); color: #3b82f6; border: 1px solid #3b82f6; }
        .status-ontrip { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid var(--warning); }
        .status-maintenance { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        
        .vehicle-actions {
            margin-top: auto;
            display: flex;
            gap: 0.5rem;
            padding-top: 1rem;
            border-top: 1px dashed var(--border-color);
        }
        .btn-outline {
            flex: 1;
            padding: 0.5rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .btn-delete {
            flex: 1;
            padding: 0.5rem;
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.1);
        }
    </style>
</head>
<body>
    <div class="app-container fade-in">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>LOGI-TRACK</h2>
            </div>
            <ul class="nav-links">
                <li><a href="operations.html"><i class="fa-solid fa-bolt"></i> Operations</a></li>
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="vehicles.html" class="active"><i class="fa-solid fa-truck"></i> Fleet</a></li>
                <li><a href="drivers.html"><i class="fa-solid fa-users"></i> Drivers</a></li>
                <li><a href="orders.html"><i class="fa-solid fa-box-open"></i> Orders</a></li>
                <li><a href="tracking.html"><i class="fa-solid fa-map-location-dot"></i> Live Tracking</a></li>
                <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" onclick="logout()" class="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header slide-down">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="vehicle-search" placeholder="Search by number or type...">
                </div>
                <div class="user-profile">
                    <div class="notification-bell">
                        <i class="fa-solid fa-bell"></i>
                    </div>
                    <div class="avatar"><i class="fa-solid fa-building"></i></div>
                </div>
            </header>

            <div class="page-content slide-up">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h1 class="page-title" style="margin:0;">Fleet Management</h1>
                    <button class="btn-primary" style="width: auto; padding: 0.6rem 1.2rem;" onclick="openVehicleModal()">
                        <i class="fa-solid fa-plus"></i> Add Vehicle
                    </button>
                </div>
                
                <div class="vehicle-grid" id="vehicle-grid">
                    <!-- Vehicles populated here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Add Vehicle Modal -->
    <div class="modal-overlay hidden" id="vehicle-modal">
        <div class="modal-content slide-up">
            <div class="modal-header">
                <h3 style="color:var(--text-main);">Add New Vehicle</h3>
                <button class="modal-close" onclick="closeVehicleModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="vehicle-form">
                <div class="form-group">
                    <label>Vehicle Number (e.g. TN-01-AB-1234)</label>
                    <input type="text" id="veh-number" required>
                </div>
                <div class="form-group">
                    <label>Vehicle Type</label>
                    <select id="veh-type" required>
                        <option value="Lorry">Lorry</option>
                        <option value="Container Truck">Container Truck</option>
                        <option value="Trailer">Trailer</option>
                        <option value="Pickup">Pickup</option>
                        <option value="Mini Truck">Mini Truck</option>
                        <option value="Tanker">Tanker</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Load Capacity (Tons)</label>
                    <input type="number" id="veh-capacity" step="0.1" required>
                </div>
                <div class="form-group">
                    <label>Fuel Capacity (Liters)</label>
                    <input type="number" id="veh-fuel" step="1" required>
                </div>
                <button type="submit" class="btn-primary">Save Vehicle</button>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/vehicles.js"></script>
    <script>
        function logout() {
            localStorage.removeItem('company_id');
            window.location.href = 'index.html';
        }
        function openVehicleModal() {
            document.getElementById('vehicle-modal').classList.remove('hidden');
        }
        function closeVehicleModal() {
            document.getElementById('vehicle-modal').classList.add('hidden');
            document.getElementById('vehicle-form').reset();
        }
        
        // Close modal when clicking outside
        document.getElementById('vehicle-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeVehicleModal();
            }
        });
    </script>
</body>
</html>
