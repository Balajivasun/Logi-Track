<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGI-TRACK - Login & Register</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <!-- Login Form -->
        <div class="auth-box" id="login-box">
            <div class="auth-header">
                <h2>LOGI-TRACK</h2>
                <p>Welcome back! Please login to your account.</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <p class="auth-switch">Don't have an account? <span onclick="toggleAuth()">Register here</span></p>
        </div>

        <!-- Register Form -->
        <div class="auth-box hidden" id="register-box">
            <div class="auth-header">
                <h2>LOGI-TRACK</h2>
                <p>Register your logistics company.</p>
            </div>
            <form id="register-form">
                <div class="input-group">
                    <i class="fa-solid fa-building"></i>
                    <input type="text" id="reg-company-name" placeholder="Company Name" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="reg-email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-phone"></i>
                    <input type="text" id="reg-phone" placeholder="Contact Number" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="reg-password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-primary">Register</button>
            </form>
            <p class="auth-switch">Already have an account? <span onclick="toggleAuth()">Login here</span></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
