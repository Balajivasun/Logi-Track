<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGI-TRACK - Live Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        .map-container {
            width: 100%;
            height: 600px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            position: relative;
            border: 1px solid var(--border-color);
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .map-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(24, 24, 24, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            width: 300px;
            z-index: 1;
        }
        .truck-marker {
            background-color: var(--primary-color);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid #1f1f1f;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #121212;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .truck-marker:hover {
            transform: scale(1.1);
        }
        .maplibregl-popup-content {
            border-radius: var(--radius-md);
            padding: 15px;
            font-family: 'Outfit', sans-serif;
            box-shadow: var(--shadow-lg);
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .maplibregl-popup-close-button {
            font-size: 16px;
            padding: 5px;
            color: var(--text-muted);
        }
        .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
            border-top-color: var(--card-bg);
        }
    </style>
</head>
<body>
    <div class="app-container fade-in">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>LOGI-TRACK</h2>
            </div>
            <ul class="nav-links">
                <li><a href="operations.html"><i class="fa-solid fa-bolt"></i> Operations</a></li>
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="vehicles.html"><i class="fa-solid fa-truck"></i> Fleet</a></li>
                <li><a href="drivers.html"><i class="fa-solid fa-users"></i> Drivers</a></li>
                <li><a href="orders.html"><i class="fa-solid fa-box-open"></i> Orders</a></li>
                <li><a href="tracking.html" class="active"><i class="fa-solid fa-map-location-dot"></i> Live Tracking</a></li>
                <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" onclick="logout()" class="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header slide-down">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search by vehicle number...">
                </div>
                <div class="user-profile">
                    <div class="notification-bell">
                        <i class="fa-solid fa-bell"></i>
                    </div>
                    <div class="avatar"><i class="fa-solid fa-building"></i></div>
                </div>
            </header>

            <div class="page-content slide-up">
                <h1 class="page-title">Fleet Live Tracking</h1>
                
                <div class="map-container">
                    <div id="map"></div>
                    <div class="map-overlay">
                        <h3 style="margin-bottom:1rem; color:var(--text-main);">Active Transit Fleet</h3>
                        <div id="active-fleet-list" style="display:flex; flex-direction:column; gap:10px;">
                            <!-- Active vehicles populated here -->
                            <p style="color:var(--text-muted); font-size:0.9rem;">No vehicles are currently on a trip.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/tracking.js"></script>
    <script>
        function logout() {
            localStorage.removeItem('company_id');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
